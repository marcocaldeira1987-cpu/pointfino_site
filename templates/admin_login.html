<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão da agenda | PointFino</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-md rounded-3xl border border-emerald-500/30 bg-slate-900 p-8 shadow-2xl">
        <p class="text-center text-emerald-400 text-xs font-bold uppercase tracking-widest mb-2">PointFino</p>
        <h1 class="text-center text-2xl font-black mb-2">Gestão da agenda</h1>
        <p class="text-center text-slate-400 text-sm mb-8">Área reservada aos barbeiros.</p>
        {% if error %}<p class="rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-sm p-3 mb-4">{{ error }}</p>{% endif %}
        <form method="post" class="space-y-4">
            <input type="hidden" name="next" value="{{ next }}">
            <label class="block text-sm font-semibold text-slate-300">Password
                <input type="password" name="password" required autofocus autocomplete="current-password" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:border-emerald-400">
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-400">
                <input type="checkbox" name="remember" class="accent-emerald-500"> Manter sessão iniciada neste dispositivo
            </label>
            <button class="w-full rounded-xl bg-emerald-500 text-slate-950 font-black py-3 hover:bg-emerald-400">Entrar na agenda</button>
        </form>
    </main>
</body>
</html>
